name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build

      - name: Prefix assets for project Pages
        run: find dist/client -type f ( -name '*.html' -o -name '*.js' -o -name '*.css' ) -print0 | xargs -0 sed -i -e 's#/_next/#/vraj-patel-portfolio/_next/#g' -e 's#/vraj-patel.jpg#/vraj-patel-portfolio/vraj-patel.jpg#g' -e 's#/Vraj_Patel_CV.pdf#/vraj-patel-portfolio/Vraj_Patel_CV.pdf#g' -e 's#/favicon.svg#/vraj-patel-portfolio/favicon.svg#g'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
